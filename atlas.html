P("sun","Sun","Star · G2V","The star that powers every world around it.",8,0,0,25,"#ffb13b",1392700,["Diameter","1.39 million km","Mass","1.989×10³⁰ kg","Surface temp","5,500 °C","Core temp","15 million °C","Rotation","25–35 days","Gravity","274 m/s²"],"The Sun holds 99.86% of the Solar System’s mass. In its core, hydrogen fuses into helium, releasing the energy that reaches us as light 8 minutes and 20 seconds later. It is about 4.6 billion years old and roughly halfway through its life.","It fuses about 600 million tonnes of hydrogen every second.",["earth","jupiter","mercury"]),
