<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1200, initial-scale=1">
  <title>OG Image Generator — Cosmos Magazine</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    /* Target size: 1200 × 630 px */
    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #03040a;
      font-family: "DM Mono", ui-monospace, monospace;
      color: #e9edff;
    }
    /* Star field via CSS radial gradients */
    .stars {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,.9) 0%, transparent 100%),
        radial-gradient(1px 1px at 25% 55%, rgba(255,255,255,.7) 0%, transparent 100%),
        radial-gradient(1px 1px at 40% 15%, rgba(200,220,255,.9) 0%, transparent 100%),
        radial-gradient(1px 1px at 55% 70%, rgba(255,255,255,.8) 0%, transparent 100%),
        radial-gradient(1px 1px at 70% 30%, rgba(255,220,180,.9) 0%, transparent 100%),
        radial-gradient(1px 1px at 80% 80%, rgba(255,255,255,.7) 0%, transparent 100%),
        radial-gradient(1px 1px at 90% 10%, rgba(200,230,255,.9) 0%, transparent 100%),
        radial-gradient(1px 1px at 15% 85%, rgba(255,255,255,.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 60% 45%, rgba(255,255,255,.8) 0%, transparent 100%),
        radial-gradient(1px 1px at 35% 90%, rgba(255,200,180,.7) 0%, transparent 100%),
        radial-gradient(2px 2px at 85% 50%, rgba(255,255,255,.5) 0%, transparent 100%),
        radial-gradient(2px 2px at 5% 40%, rgba(200,200,255,.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 47% 5%, rgba(255,255,255,.9) 0%, transparent 100%),
        radial-gradient(1px 1px at 92% 65%, rgba(255,255,255,.7) 0%, transparent 100%),
        radial-gradient(1px 1px at 3% 60%, rgba(255,255,255,.8) 0%, transparent 100%),
        radial-gradient(1px 1px at 68% 88%, rgba(200,220,255,.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 22% 33%, rgba(255,255,255,.7) 0%, transparent 100%),
        radial-gradient(1px 1px at 77% 15%, rgba(255,230,200,.8) 0%, transparent 100%),
        #03040a;
    }
    /* Nebula glow overlay */
    .nebula {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 900px 400px at 65% 40%, rgba(94, 225, 255, .07) 0%, transparent 70%),
        radial-gradient(ellipse 600px 300px at 20% 60%, rgba(155, 140, 255, .09) 0%, transparent 60%),
        radial-gradient(ellipse 700px 200px at 50% 80%, rgba(228, 87, 46, .05) 0%, transparent 60%);
    }
    /* Dark gradient overlay from right */
    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(105deg, rgba(3,4,10,0) 40%, rgba(3,4,10,.85) 100%);
    }
    /* Content */
    .content {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 60px 80px;
    }
    .eyebrow {
      font-size: 14px;
      letter-spacing: .3em;
      text-transform: uppercase;
      color: #e4572e;
      margin-bottom: 20px;
    }
    h1 {
      font-family: "Bodoni Moda", "Georgia", serif;
      font-size: 72px;
      font-weight: 700;
      line-height: 1.05;
      color: #e9edff;
      max-width: 700px;
      margin-bottom: 24px;
      letter-spacing: -.01em;
    }
    h1 span { color: #5ee1ff; }
    .desc {
      font-size: 20px;
      color: #9aa6c8;
      max-width: 560px;
      line-height: 1.5;
      margin-bottom: 40px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      border: 1px solid rgba(150,170,255,.3);
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 13px;
      letter-spacing: .1em;
      color: #9aa6c8;
      background: rgba(8,12,30,.5);
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #5ee1ff; }
    /* Planet illustration top-right */
    .planet-wrap {
      position: absolute;
      right: -80px;
      top: 50%;
      transform: translateY(-50%);
    }
    .planet {
      width: 420px;
      height: 420px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #cdb58a, #7a5f30 60%, #3a2a10 100%);
      box-shadow:
        -40px 0 80px rgba(0,0,0,.8),
        0 0 120px rgba(94,225,255,.06),
        inset -60px -20px 80px rgba(0,0,0,.6);
      position: relative;
      overflow: visible;
    }
    .ring {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotateX(75deg);
      width: 660px;
      height: 660px;
      border-radius: 50%;
      border: 22px solid rgba(215, 195, 150, .45);
      box-shadow: 0 0 40px rgba(215,195,150,.15);
      pointer-events: none;
    }
    .ring2 {
      width: 720px;
      height: 720px;
      border-width: 10px;
      border-color: rgba(215, 195, 150, .25);
    }
    /* URL watermark */
    .url {
      position: absolute;
      bottom: 24px;
      right: 40px;
      font-size: 13px;
      color: rgba(150,170,255,.4);
      letter-spacing: .08em;
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@700&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
</head>
<body>
  <div class="stars"></div>
  <div class="nebula"></div>
  <div class="overlay"></div>
  <div class="planet-wrap">
    <div class="planet">
      <div class="ring"></div>
      <div class="ring ring2"></div>
    </div>
  </div>
  <div class="content">
    <p class="eyebrow">✦ Cosmos Magazine</p>
    <h1>The Cosmos<br><span>After Dark</span></h1>
    <p class="desc">Astronomy news, observing guides and a live 3D map of the universe.</p>
    <div class="badge">
      <div class="dot"></div>
      pradeepbalaji2011-ux.github.io/cosmos-magazine
    </div>
  </div>
  <div class="url">pradeepbalaji2011-ux.github.io/cosmos-magazine</div>
</body>
</html>
